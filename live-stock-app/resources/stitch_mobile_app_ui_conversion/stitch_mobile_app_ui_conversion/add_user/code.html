<!-- Full Name -->
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-widest text-outline ml-1" for="full-name">Full Name</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-xl px-4 py-4 text-on-surface focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline-variant shadow-sm" id="full-name" placeholder="e.g. Elias Thorne" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline/50 group-focus-within:text-primary" data-icon="person">person</span>
</div>
</div>
<!-- Email Address -->
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-widest text-outline ml-1" for="email">Email Address</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-xl px-4 py-4 text-on-surface focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline-variant shadow-sm" id="email" placeholder="elias@verdant.com" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline/50 group-focus-within:text-primary" data-icon="mail">mail</span>
</div>
</div>
<!-- Role Selection (Segmented Control) -->
<div class="space-y-3">
<label class="text-xs font-bold uppercase tracking-widest text-outline ml-1">Select Role</label>
<div class="grid grid-cols-3 gap-2 bg-surface-container-low p-1 rounded-2xl">
<button class="py-3 px-2 rounded-xl text-xs font-bold transition-all bg-surface-container-lowest text-primary shadow-sm">Admin</button>
<button class="py-3 px-2 rounded-xl text-xs font-bold transition-all text-secondary hover:bg-surface-container-lowest/50">Manager</button>
<button class="py-3 px-2 rounded-xl text-xs font-bold transition-all text-secondary hover:bg-surface-container-lowest/50">Staff</button>
</div>
</div>
<!-- Branch Selection -->
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-widest text-outline ml-1">Assign Branch</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border-none rounded-xl px-4 py-4 text-on-surface focus:ring-2 focus:ring-primary-container shadow-sm">
