<body class="bg-background font-body text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
<!-- Background Texture/Image -->
<div class="absolute inset-0 z-0 opacity-10 bg-pastoral-blur" data-alt="vibrant rolling green hills of a farm landscape during early morning sunrise with soft fog and golden light"></div>
<div class="absolute inset-0 z-0 bg-gradient-to-b from-background/90 via-background to-background"></div>
<main class="w-full max-w-md z-10">
<!-- Logo Area -->
<header class="flex flex-col items-center mb-10">
<div class="w-20 h-20 bg-primary rounded-full flex items-center justify-center mb-6 shadow-[0_8px_24px_rgba(0,97,44,0.15)]">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="pets" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<h1 class="font-headline font-extrabold text-3xl tracking-tight text-primary">Saylani Pastoral</h1>
<p class="font-body text-outline text-sm mt-2">Sustainable Livestock Management</p>
</header>
<!-- Login Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_4px_32px_rgba(0,97,44,0.04)] p-8">
<div class="mb-8">
<h2 class="font-headline font-bold text-xl text-on-surface">Welcome back</h2>
<p class="font-body text-sm text-outline mt-1">Sign in to manage your livestock welfare</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label font-medium text-xs text-on-surface-variant ml-1" for="email">EMAIL ADDRESS</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container transition-all text-sm" id="email" placeholder="name@welfare.org" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label font-medium text-xs text-on-surface-variant" for="password">PASSWORD</label>
<a class="text-primary font-label font-semibold text-xs hover:underline decoration-2 underline-offset-4" href="#">Forgot password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-xl py-3.5 pl-12 pr-12 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container transition-all text-sm" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-primary" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Toggle -->
<div class="flex items-center px-1">
<input class="w-4 h-4 text-primary bg-surface-container-low border-none rounded-lg focus:ring-offset-0 focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="ml-3 text-sm text-on-surface-variant font-medium" for="remember">Keep me signed in</label>
</div>
<!-- Login Button -->
<button class="w-full editorial-gradient text-on-primary font-headline font-bold py-4 rounded-full shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Login to system</span>
<span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-8 border-t border-surface-container flex flex-col items-center">
<p class="text-xs text-outline font-medium text-center">New to the pastoral platform?</p>
<button class="mt-3 text-primary font-headline font-bold text-sm hover:opacity-80 transition-opacity">Request Account Access</button>
</div>
</section>
<!-- Welfare Note -->
<div class="mt-8 flex items-center justify-center gap-4 px-4">
<div class="h-[1px] flex-grow bg-surface-container-high"></div>
<div class="flex items-center gap-2 text-[10px] font-bold text-on-secondary-container bg-secondary-container px-3 py-1 rounded-full uppercase tracking-widest">
<span class="material-symbols-outlined text-[14px]" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
                Secure Environment
            </div>
<div class="h-[1px] flex-grow bg-surface-container-high"></div>
</div>
</main>
<!-- Footer -->
<footer class="w-full mt-auto py-8 z-10">
<div class="flex flex-col items-center gap-2">
<p class="text-xs font-headline font-bold text-on-surface-variant">SAYLANI WELFARE INTERNATIONAL TRUST</p>
<p class="text-[10px] font-body text-outline uppercase tracking-[0.2em]">© 2024 PASTORAL MANAGEMENT SYSTEM</p>
</div>
</footer>
