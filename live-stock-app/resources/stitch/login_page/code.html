<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Saylani Welfare - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-container": "#ccffcb",
                      "inverse-primary": "#88d98f",
                      "surface-container-low": "#eff4ff",
                      "inverse-on-surface": "#eaf1ff",
                      "surface-tint": "#1a6c30",
                      "error": "#ba1a1a",
                      "outline": "#707a6e",
                      "on-secondary-fixed": "#001b3d",
                      "tertiary-fixed-dim": "#ffb95f",
                      "on-secondary": "#ffffff",
                      "surface-variant": "#d3e4fe",
                      "error-container": "#ffdad6",
                      "on-error": "#ffffff",
                      "surface-container-highest": "#d3e4fe",
                      "secondary-container": "#64a1ff",
                      "on-secondary-container": "#003670",
                      "primary": "#0c6328",
                      "primary-fixed": "#a3f6a9",
                      "outline-variant": "#bfc9bb",
                      "surface": "#f8f9ff",
                      "on-tertiary-container": "#fff0e3",
                      "on-tertiary-fixed-variant": "#653e00",
                      "on-primary-fixed": "#002108",
                      "on-tertiary": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface-container": "#e5eeff",
                      "background": "#f8f9ff",
                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed-dim": "#a9c7ff",
                      "on-surface": "#0b1c30",
                      "primary-container": "#2e7d3e",
                      "tertiary-container": "#9b6200",
                      "primary-fixed-dim": "#88d98f",
                      "inverse-surface": "#213145",
                      "secondary": "#005db7",
                      "surface-container-high": "#dce9ff",
                      "tertiary": "#7a4c00",
                      "surface-dim": "#cbdbf5",
                      "on-secondary-fixed-variant": "#00468c",
                      "secondary-fixed": "#d6e3ff",
                      "on-tertiary-fixed": "#2a1700",
                      "on-surface-variant": "#40493f",
                      "on-primary-fixed-variant": "#00531e",
                      "surface-bright": "#f8f9ff",
                      "on-error-container": "#93000a",
                      "tertiary-fixed": "#ffddb8",
                      "on-background": "#0b1c30"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Manrope"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f4; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .input-focus-ring:focus-within { border-bottom: 2px solid #0c6328; }
        .shadow-custom { box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- Login Card Container -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-custom border border-[#c8deca] overflow-hidden">
<!-- Header / Logo Section -->
<div class="px-8 pt-10 pb-6 text-center">
<div class="mb-6 flex justify-center">
<div class="flex flex-col items-center">
<span class="text-2xl font-extrabold font-headline tracking-tight text-primary">Saylani Welfare</span>
<span class="text-[10px] uppercase tracking-[0.2em] text-outline font-medium mt-1">Livestock Enterprise</span>
</div>
</div>
<h1 class="text-2xl font-bold font-headline text-on-surface">Welcome Back</h1>
<p class="text-on-surface-variant text-sm mt-2">Enter your credentials to access the console</p>
</div>
<!-- Form Section -->
<form class="px-8 pb-8 space-y-6">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container-low border-none rounded-t-xl border-b-2 border-outline-variant focus:ring-0 focus:border-primary text-on-surface placeholder:text-outline/60 transition-all font-body text-sm" id="email" name="email" placeholder="admin@saylani.org" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="password">Password</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-12 py-3 bg-surface-container-low border-none rounded-t-xl border-b-2 border-outline-variant focus:ring-0 focus:border-primary text-on-surface placeholder:text-outline/60 transition-all font-body text-sm" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<div class="pt-2">
<button class="w-full py-3.5 px-4 bg-gradient-to-br from-primary to-primary-container text-white font-bold font-headline rounded-xl shadow-lg shadow-primary/10 hover:shadow-primary/20 active:scale-[0.98] transition-all duration-200" type="submit">
                    Login
                </button>
</div>
</form>
<!-- Footer Actions -->
<div class="bg-surface-container-low/50 px-8 py-6 text-center space-y-3">
<a class="block text-sm font-medium text-primary hover:text-primary-container transition-colors" href="#">
                Forgot password?
            </a>
<p class="text-xs text-on-surface-variant">
                Need help? <a class="text-primary font-semibold hover:underline" href="#">Contact admin</a>
</p>
</div>
</main>
<!-- Decorative Elements (Optional, based on 'Verdant Archive' theme) -->
<div class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-primary-container to-inverse-primary opacity-50"></div>
<div class="hidden lg:block fixed -bottom-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="hidden lg:block fixed -top-24 -right-24 w-96 h-96 bg-primary-container/5 rounded-full blur-3xl"></div>
</body></html>
